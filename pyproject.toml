[project]
name = "rageval"
version = "0.1.0"
description = "A RAG system with a retrieval + generation evaluation harness wired into CI."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Heavier, "production" backends. Not needed for tests/CI.
local = [
    "sentence-transformers>=2.6",
    "chromadb>=0.5",
]
providers = [
    "cohere>=5.0",
    "openai>=1.30",
    "pinecone-client>=4.0",
]
evals = [
    "ragas>=0.2",
    "deepeval>=1.0",
    "datasets>=2.19",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
